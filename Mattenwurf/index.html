<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#10151c">
<title>Mattenwurf</title>
<link rel="icon" href="images/mattenwurf.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: #2b2f34; color: #eceff2; font: 15px system-ui, sans-serif;
  }
  canvas { max-width: 100vw; max-height: 100vh; background: #49694d; touch-action: none; border: 1px solid #2a2a2a; }
  /* Start-Overlay "KroxenStudios" (wie in Asphalt Arkade) */
  .splash { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 22px; background: #2b2f34; pointer-events: none; animation: splash-out 0.6s ease 2.2s forwards; }
  .splash-name { color: #e10600; font-size: clamp(32px, 9vw, 84px); font-weight: 900; letter-spacing: 0.08em; animation: splash-in 0.9s ease both; }
  .splash-bar { width: clamp(140px, 30vw, 320px); height: 3px; background: #e1060033; overflow: hidden; }
  .splash-bar i { display: block; width: 100%; height: 100%; background: #e10600; transform-origin: left; animation: splash-load 2s ease-in-out both; }
  @keyframes splash-in { from { opacity: 0; letter-spacing: 0.3em; } to { opacity: 1; letter-spacing: 0.08em; } }
  @keyframes splash-load { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes splash-out { to { opacity: 0; visibility: hidden; } }
</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-name">KroxenStudios</div>
  <div class="splash-bar"><i></i></div>
</div>
<canvas id="c" width="960" height="540" aria-label="Mattenwurf"></canvas>
<script src="../i18n.js"></script>
<script src="game.js"></script>
</body>
</html>
