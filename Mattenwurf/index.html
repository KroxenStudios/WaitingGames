<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#10151c">
<title>Mattenwurf</title>
<link rel="icon" href="images/mattenwurf.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: #2b2f34; color: #eceff2; font: 15px system-ui, sans-serif;
  }
  canvas { max-width: 100vw; max-height: 100vh; background: #49694d; touch-action: none; border: 1px solid #2a2a2a; }
  /* Start-Overlay "KroxenStudios" (wie in Asphalt Arkade) */
  .splash { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 22px; background: #2b2f34; pointer-events: none; animation: splash-out 0.6s ease 2.2s forwards; }
  .splash-name { color: #e10600; font-size: clamp(32px, 9vw, 84px); font-weight: 900; letter-spacing: 0.08em; animation: splash-in 0.9s ease both; }
  .splash-bar { width: clamp(140px, 30vw, 320px); height: 3px; background: #e1060033; overflow: hidden; }
  .splash-bar i { display: block; width: 100%; height: 100%; background: #e10600; transform-origin: left; animation: splash-load 2s ease-in-out both; }
  @keyframes splash-in { from { opacity: 0; letter-spacing: 0.3em; } to { opacity: 1; letter-spacing: 0.08em; } }
  @keyframes splash-load { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes splash-out { to { opacity: 0; visibility: hidden; } }
</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-name">KroxenStudios</div>
  <div class="splash-bar"><i></i></div>
</div>
<canvas id="c" width="960" height="540" aria-label="Mattenwurf"></canvas>
<script src="../i18n.js"></script>
<script>
"use strict";
const L = WG.L;
// ================= Konfiguration =================
const W = 960, H = 540;
const BASE = 500;            // Bildschirm-y für z=0,h=0
const ZK = 0.55;             // Tiefen-Projektion
const G = 900;               // Schwerkraft (nur Höhe)
const ANGLE = Math.PI / 4;   // fester Wurfwinkel
const P_MAX = 560;
const WIND = 0.22, SWING = 0.08, FOLLOW = 0.22, LEAD = 0.05;   // Wurfanimation (Sekunden)
const PLAYER_Z = 10, PLAYER_SCREEN_X = 220;
const RX = 22, H0 = 84;      // Abwurfpunkt der Hand relativ zum Fahrer (x, Hoehe)
const SPEED = 150, SPACING = 420;
const ZMAX = 250, MAT_HALF_X = 34;     // ZMAX: hinterster Rasenrand; jedes Haus hat eigene Wandtiefe zw
const HUD_H = 54;

// Farben wie in Asphalt Arkade
const PAL = {
  ground: '#49694d', side: '#a3a6a0', road: '#5b5f64', line: '#e8dcae',
  build: ['#947b6a', '#758397', '#9a846c', '#778b76', '#a68a7a', '#7d8aa0'],
  roof: ['#a5523f', '#7c4a3a', '#5d6d7e', '#8c6a4a'],
  tree: ['#31583c', '#4d8052'], park: '#3f6b43',
  outline: 'rgba(35,28,24,0.6)', accent: '#65e6a5', gold: '#ffd166', dim: '#9eacba',
  cars: ['#57d6a1', '#68a8ff', '#ff6868', '#ff9d3c', '#ffd166', '#c792ea'],
};

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const sy = (z, h) => BASE - z * ZK - h;

// ================= Speicherstand =================
let stored = {};
try { stored = JSON.parse(localStorage.getItem('mattenwurf') || '{}'); } catch (e) {}
const save = Object.assign({ coins: 0, bag: 0, aim: 0, best: 0 }, stored);
const persist = () => { try { localStorage.setItem('mattenwurf', JSON.stringify(save)); } catch (e) {} };
const bagSize = () => 10 + 3 * save.bag;
const AIM_MAX = 4;
const jitter = () => 0.02 / (1 + 0.5 * save.aim);   // zufaellige Tempo-Abweichung des Wurfs
const costBag = () => 20 + 20 * save.bag;
const costAim = () => 15 + 25 * save.aim;

// ================= Zufall =================
function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];

// ================= Häuser =================
const houses = new Map();
function house(i) {
  if (houses.has(i)) return houses.get(i);
  const r = rng(i * 7919 + 13);
  const cx = 700 + i * SPACING;
  const garage = r() < 0.4 ? (r() < 0.5 ? -1 : 1) : 0;
  const zw = 185 + Math.floor(r() * 65);          // Einrueckung: Abstand der Hauswand zur Strasse
  const hs = {
    i, cx, zw, mz0: zw - 35, mz1: zw - 5, w: 240, h: 130 + Math.floor(r() * 30), delivered: false, landX: 0, landZ: 0,
    kind: pick(r, ['gable', 'gable', 'flat']),
    wall: pick(r, PAL.build), roof: pick(r, PAL.roof),
    winX: cx + (r() < 0.5 ? -80 : 80), broken: false,
    garage, chimney: r() < 0.6, fence: pick(r, [0, 0, 1, 2]), fenceCol: pick(r, ['#e8e4d8', '#c9b27c', '#8fa8b8']),
    number: 1 + Math.floor(r() * 60), curtain: pick(r, ['#c0584a', '#e8dcae', '#6fa0c8']),
    obstacles: [], flowers: [], tufts: [],
    // Lücke zwischen den Häusern
    gapX: cx + SPACING / 2,
    tree: r() < 0.8, tree2: r() < 0.5, lamp: r() < 0.7, bench: r() < 0.25, hydrant: r() < 0.3, bin: r() < 0.4,
    parked: r() < 0.5 ? { col: pick(r, PAL.cars), dx: (r() - .5) * 120, kind: pick(r, ['car', 'van']) } : null,
    mailbox: r() < 0.8, bushes: [],
  };
  hs.wins = [{ x: hs.winX, w: 30, h0: 70, h1: 120, broken: false },
             { x: hs.winX > cx ? cx - 80 : cx + 80, w: 26, h0: 66, h1: 112, broken: false }];
  hs.x0 = cx - hs.w / 2 - (garage < 0 ? 70 : 0);
  hs.x1 = cx + hs.w / 2 + (garage > 0 ? 70 : 0);
  const n = 1 + Math.floor(r() * 2);
  for (let k = 0; k < n; k++) {
    const gnome = r() < 0.5;
    hs.obstacles.push({
      type: gnome ? 'gnome' : 'pot',
      x: cx + (r() * 2 - 1) * 105, z: 120 + r() * Math.max(5, zw - 60 - 120),
      rad: gnome ? 16 : 15, hgt: gnome ? 38 : 26, hit: false, col: pick(r, ['#2f6fd0', '#2f9f6b', '#a24fd0']),
    });
  }
  for (let k = 0; k < 7; k++) hs.flowers.push({ x: cx - 190 + r() * 380, z: 108 + r() * (zw - 130), c: pick(r, ['#ff6868', '#ffd166', '#f4f1e8', '#e5508a']) });
  for (let k = 0; k < 14; k++) hs.tufts.push({ x: cx - 205 + r() * 410, z: 105 + r() * (zw - 115) });
  for (let k = 0; k < 3; k++) hs.bushes.push({ x: cx - hs.w / 2 + 12 + k * (hs.w - 24) / 2 + (r() - .5) * 10, s: 11 + r() * 5 });
  houses.set(i, hs);
  return hs;
}

// ================= Spielzustand =================
let state = 'menu', t = 0, shake = 0, camX = 0;
let player = { x: 0 };
let papers = [], popups = [], shards = [], parts = [], coinsFly = [], traffic = [];
let left = 0, score = 0, streak = 0, coinsRound = 0, finishing = 0, trafficTimer = 0;
let pending = null, hover = null, follow = 0, aimMsg = null, shout = null, voiceOn = false /* Sprachausgabe deaktiviert (Code bleibt erhalten) */, tickT = 0, birdT = 3, escT = 0;
let hudCoinPulse = 0;

function startRound() {
  houses.clear();
  player = { x: 0 };
  papers = []; popups = []; shards = []; parts = []; coinsFly = []; traffic = []; trafficTimer = 1;
  left = bagSize(); score = 0; streak = 0; coinsRound = 0;
  pending = null; hover = null; follow = 0; aimMsg = null; shout = null; finishing = 0;
  state = 'play'; sfx('start');
}

// ================= Wurf =================
// Flugdauer und Reichweite (Hoehe H0 -> 0) bei Abwurfgeschwindigkeit P unter festem Winkel
function flightT(P) { const vh = P * Math.sin(ANGLE); return (vh + Math.sqrt(vh * vh + 2 * G * H0)) / G; }
function rangeZ(P) { return P * Math.cos(ANGLE) * flightT(P); }
function solveP(dz) {                       // Bisektion: passende Abwurfgeschwindigkeit fuer Tiefe dz
  let lo = 0, hi = 900;
  for (let k = 0; k < 30; k++) { const m = (lo + hi) / 2; if (rangeZ(m) < dz) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
// Zielpunkt auf dem Boden (Bildschirm -> Welt) auswerten
function evalTarget(mx, my) {
  const tx = mx + camX, tz = (BASE - my) / ZK;
  const r = { ok: false, tx, tz, msg: '' };
  if (my < HUD_H) return r;
  for (let i = Math.max(0, Math.floor((tx - 700) / SPACING) - 1); i <= Math.floor((tx - 700) / SPACING) + 1; i++) {
    const hs = house(i);
    for (const w of hs.wins) {
      if (w.broken || Math.abs(tx - w.x) > w.w || my < sy(hs.zw, w.h1) || my > sy(hs.zw, w.h0)) continue;
      const th = (w.h0 + w.h1) / 2, dz = hs.zw - PLAYER_Z, cs = Math.cos(ANGLE);
      const denom = H0 + dz * Math.tan(ANGLE) - th;
      Object.assign(r, { tx: w.x, tz: hs.zw, th, zStop: hs.zw });
      if (denom <= 0) { r.msg = L('Zu weit', 'Too far'); return r; }
      r.P = Math.sqrt(G * dz * dz / (2 * cs * cs * denom));
      if (r.P > P_MAX) { r.msg = L('Zu weit', 'Too far'); return r; }
      r.T = dz / (r.P * cs);
      r.xrel = w.x - SPEED * r.T - RX;
      if ((r.xrel - player.x) / SPEED < WIND + SWING + LEAD) { r.msg = L('Zu spät', 'Too late'); return r; }
      r.ok = true;
      return r;
    }
  }
  if (tz > ZMAX - 2) { r.msg = L('Auf den Boden zielen', 'Aim at the ground'); return r; }
  for (let i = Math.max(0, Math.floor((tx - 700) / SPACING) - 1); i <= Math.floor((tx - 700) / SPACING) + 1; i++) {
    const hs = house(i);
    if (tx > hs.x0 && tx < hs.x1 && tz > hs.zw - 2) { r.msg = L('Auf den Boden zielen', 'Aim at the ground'); return r; }
  }
  if (tz < 45) { r.msg = L('Zu nah', 'Too close'); return r; }
  r.P = solveP(tz - PLAYER_Z);
  if (r.P > P_MAX) { r.msg = L('Zu weit', 'Too far'); return r; }
  r.T = flightT(r.P);
  r.xrel = tx - SPEED * r.T - RX;               // Fahrer-Position, an der geworfen wird
  if ((r.xrel - player.x) / SPEED < WIND + SWING + LEAD) { r.msg = L('Zu spät', 'Too late'); return r; }
  r.ok = true;
  return r;
}
// Zurufe des Zeitungsjungen: Sprechblase + (optional) Sprachausgabe
const THROW_CALLS = L(['ZEEITUNG!', 'ZEIIITUNG!', 'ZEEEITUNG!!', 'Frische Zeitung!', 'Zeitung kommt!', 'Vorsicht, Papier!', 'Morgenpost!', 'Pappe im Anflug', 'Viel spass damit', 'FLIEEEG, Zeitung'],
  ['NEEEWSPAPER!', 'PAAAPER!', 'FRESH NEWS!', 'Fresh paper!', 'Paper coming in!', 'Heads up, paper!', 'Morning post!', 'Incoming paper', 'Enjoy the read', 'FLYYY, paper']);
function say(text, big = false) {
  shout = { text, life: 1.3, age: 0, big };
  if (!voiceOn || !window.speechSynthesis) return;
  try {
    if (speechSynthesis.speaking) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[!]/g, '').replace(/([EI])\1+/g, '$1$1'));
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(WG.lang));
    if (v) u.voice = v;
    u.lang = L('de-DE', 'en-US'); u.rate = big ? 0.7 : 0.85; u.pitch = 1.7; u.volume = 0.8;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function aimAt(mx, my) {
  if (left <= 0) return;
  if (pending && (pending.xrel - player.x) / SPEED < WIND + SWING + 0.1) return;   // Wurf laeuft schon
  const r = evalTarget(mx, my);
  if (!r.ok) { if (r.msg) { aimMsg = { text: r.msg, x: mx, y: my, life: 0.9 }; sfx('deny'); } return; }
  pending = r;
  sfx('aim');
}
function releasePaper() {
  const P = pending.P * (1 + (Math.random() * 2 - 1) * jitter());   // minimal variierendes Tempo
  const v = { vx: SPEED, vz: P * Math.cos(ANGLE), vh: P * Math.sin(ANGLE) };
  papers.push({ x: pending.xrel + RX, z: PLAYER_Z, h: H0, ...v, rot: 0, alive: true, trail: 0 });
  left--; pending = null; follow = FOLLOW;
  sfx('throw');
}

function resolve(p) {
  const base = Math.floor((p.x - 700) / SPACING);
  for (let i = base - 1; i <= base + 1; i++) {
    if (i < 0) continue;
    const hs = house(i);
    if (p.z >= hs.zw && p.x > hs.x0 && p.x < hs.x1) {
      const w = hs.wins.find(w => Math.abs(p.x - w.x) < w.w && p.h > w.h0 && p.h < w.h1);
      if (w) {
        if (!w.broken) { w.broken = true; spawnShards(w.x, p.h, hs.zw); }
        sfx('glass'); award(-10, L('Fenster! -10', 'Window! -10'), p, true); burst(p, '#bfe6ff', 10);
        popups.push({ x: w.x, y: sy(hs.zw, 40) - 20, text: pick(Math.random, L(['HEY!', 'Mein Fenster!', 'Na warte!', 'KLIRR!', 'Oh, eine Zeitung', 'AAAAAHHH', 'Da ist ja meine Zeitung...', 'Ahh ein EINBRECHER!!!', 'Das wird Teuer', 'Warum immer ich?', '*Keine Reaktion*'],
    ['HEY!', 'My window!', 'You just wait!', 'CRASH!', 'Oh, a newspaper', 'AAAAAHHH', 'There is my newspaper...', 'Ahh a BURGLAR!!!', 'That will be expensive', 'Why always me?', '*No reaction*'])), life: 1.6, good: false, bad: false });
        return true;
      }
      sfx('wall'); award(0, L('Wand', 'Wall'), p, true); burst(p, '#f4f1e8', 5); return true;
    }
    for (const o of hs.obstacles) {
      const dx = p.x - o.x, dz = p.z - o.z;
      if (dx * dx + dz * dz < o.rad * o.rad && p.h < o.hgt) {
        o.hit = true; sfx(o.type);
        award(-5, (o.type === 'gnome' ? L('Gartenzwerg', 'Garden gnome') : L('Blumentopf', 'Flower pot')) + '! -5', p, true);
        burst(p, o.type === 'gnome' ? o.col : '#b5532f', 10); return true;
      }
    }
  }
  if (p.h <= 0) {
    p.h = 0;
    for (let i = base - 1; i <= base + 1; i++) {
      if (i < 0) continue;
      const hs = house(i);
      const dx = Math.abs(p.x - hs.cx), dz = Math.abs(p.z - (hs.mz0 + hs.mz1) / 2);
      if (dx < MAT_HALF_X && p.z > hs.mz0 && p.z < hs.mz1) {
        if (hs.delivered) { sfx('miss'); award(0, L('Schon geliefert', 'Already delivered'), p, false); return true; }
        hs.delivered = true; hs.landX = p.x; hs.landZ = p.z;
        const d = Math.hypot(dx / MAT_HALF_X, dz / ((hs.mz1 - hs.mz0) / 2));
        const perfect = d < 0.35;
        streak++;
        const bonus = (streak - 1) * 2;
        const pts = (perfect ? 20 : 10) + bonus;
        award(pts, (perfect ? L('PERFEKT! +', 'PERFECT! +') : L('Treffer +', 'Hit +')) + pts + (bonus ? L(' (Serie ', ' (Streak ') + streak + ')' : ''), p, false);
        burst(p, perfect ? PAL.gold : PAL.accent, perfect ? 16 : 8);
        sfx(perfect ? 'perfect' : 'mat');
        return true;
      }
    }
    sfx('miss'); award(0, L('Daneben', 'Missed'), p, true);
    burst(p, '#8a7a5a', 5);
    return true;
  }
  if (p.z > ZMAX + 40) { sfx('miss'); award(0, L('Zu weit', 'Too far'), p, true); return true; }
  return false;
}
function award(pts, text, p, breaks) {
  if (breaks) { streak = 0; if (pts < 0) shake = 8; }
  if (pts < 0) say(pick(Math.random, L(['ups', 'Autsch', 'Hoppla', 'Sorry', 'oh oh', 'Hat niemand gesehen...', 'Beim nächsten mal vielleicht', 'Zeitung - Geliefert bis in ihre Wohnung', 'War ich nicht!'],
    ['oops', 'Ouch', 'Whoops', 'Sorry', 'uh oh', 'Nobody saw that...', 'Maybe next time', 'Newspaper - delivered right to your flat', "Wasn't me!"])));
  else if (pts === 0 && breaks) say(pick(Math.random, L(['fast', 'Daneben!', 'ach ne', 'Oder auch nicht...'], ['almost', 'Missed!', 'oh no', 'Or not...'])));
  else if (pts >= 20) say(pick(Math.random, L(['Volltreffer!', 'Perfekt', 'Treffer, versenkt', 'Endlich...'], ['Bullseye!', 'Perfect', 'Nailed it', 'Finally...'])));
  score = Math.max(0, score + pts);
  if (pts > 0) {
    const c = Math.ceil(pts / 10);
    coinsRound += c;
    for (let k = 0; k < c; k++) coinsFly.push({ x: p.x - camX, y: sy(p.z, p.h) - 10, t: -k * 0.08, sx: p.x - camX, sy: sy(p.z, p.h) - 10 });
  }
  popups.push({ x: p.x, y: sy(p.z, p.h) - 14, text, life: 1.4, good: pts > 0, bad: pts < 0 });
}
function burst(p, col, n) {
  for (let k = 0; k < n; k++)
    parts.push({ x: p.x, z: p.z, h: Math.max(2, p.h), vx: (Math.random() - .5) * 220, vz: (Math.random() - .5) * 120, vh: 60 + Math.random() * 200, life: 0.6 + Math.random() * 0.5, col, size: 3 + Math.random() * 3 });
}
function spawnShards(x, h, z) {
  for (let k = 0; k < 14; k++)
    shards.push({ x, h, z, vx: (Math.random() - .5) * 200, vh: Math.random() * 200, life: 1 });
}

// ================= Update =================
function update(dt) {
  t += dt;
  if (shake > 0) shake = Math.max(0, shake - 30 * dt);
  if (hudCoinPulse > 0) hudCoinPulse = Math.max(0, hudCoinPulse - 3 * dt);
  if (state === 'menu') { camX += 70 * dt; }
  if (state === 'play') {
    player.x += SPEED * dt;
    camX = player.x - PLAYER_SCREEN_X;
    if (follow > 0) follow -= dt;
    if (escT > 0) escT -= dt;
    if ((tickT -= dt) <= 0) { tickT = 0.16; sfx('tick'); }
    if ((birdT -= dt) <= 0) { birdT = 4 + Math.random() * 6; sfx('bird'); }
    if (pending && !pending.shouted && (pending.xrel - player.x) / SPEED <= WIND + SWING + 0.05) { pending.shouted = true; say(pick(Math.random, THROW_CALLS), true); }
    if (pending && player.x >= pending.xrel) releasePaper();
    if (shout) { shout.age += dt; if ((shout.life -= dt) <= 0) shout = null; }
    if (aimMsg && (aimMsg.life -= dt) <= 0) aimMsg = null;
    // Staub unter den Rädern
    if (Math.random() < 0.5) parts.push({ x: player.x - 30, z: PLAYER_Z, h: 3, vx: -40 - Math.random() * 40, vz: (Math.random() - .5) * 20, vh: 20 + Math.random() * 30, life: 0.5, col: 'rgba(210,200,170,0.55)', size: 3 + Math.random() * 2 });
  }
  trafficTimer -= dt;
  if (trafficTimer <= 0) {
    trafficTimer = 3 + Math.random() * 4;
    if (state === 'play') sfx('car');
    traffic.push({ x: camX + W + 120, v: -(60 + Math.random() * 40), col: PAL.cars[Math.floor(Math.random() * PAL.cars.length)], kind: Math.random() < 0.3 ? 'van' : 'car' });
  }
  for (const c of traffic) c.x += c.v * dt;
  traffic = traffic.filter(c => c.x > camX - 200);

  if (state === 'play') {
    for (const p of papers) {
      if (!p.alive) continue;
      p.x += p.vx * dt; p.z += p.vz * dt; p.h += p.vh * dt;
      p.vh -= G * dt;
      p.rot += 9 * dt;
      p.trail -= dt;
      if (p.trail <= 0) { p.trail = 0.03; parts.push({ x: p.x, z: p.z, h: p.h, vx: 0, vz: 0, vh: 0, life: 0.25, col: 'rgba(255,255,255,0.6)', size: 2 }); }
      if (resolve(p)) p.alive = false;
    }
    papers = papers.filter(p => p.alive);
    for (const q of popups) { q.y -= 30 * dt; q.life -= dt; }
    popups = popups.filter(q => q.life > 0);
    if (left <= 0 && papers.length === 0 && !pending) {
      finishing += dt;
      if (finishing > 1.4) endRound();
    }
  }
  for (const s of shards) { s.x += s.vx * dt; s.h += s.vh * dt; s.vh -= G * dt; s.life -= dt; }
  shards = shards.filter(s => s.life > 0 && s.h > 0);
  for (const q of parts) { q.x += q.vx * dt; q.z += q.vz * dt; q.h += q.vh * dt; q.vh -= G * 0.6 * dt; q.life -= dt; if (q.h < 0) { q.h = 0; q.vh = 0; q.vx *= 0.8; } }
  parts = parts.filter(q => q.life > 0);
  // Münzen fliegen zur Anzeige
  for (const c of coinsFly) {
    c.t += dt * 1.6;
    if (c.t >= 1 && !c.done) { c.done = true; hudCoinPulse = 1; sfx('coin'); }
  }
  coinsFly = coinsFly.filter(c => !c.done);
  hudCoinPulse = hudCoinPulse;
}
function endRound() {
  save.coins += coinsRound;
  save.best = Math.max(save.best, score);
  persist();
  state = 'end'; sfx('end');
}

// ================= Zeichen-Helfer =================
function rectO(x, y, w, h, col, lw = 3) {
  ctx.fillStyle = col; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = PAL.outline; ctx.lineWidth = lw; ctx.strokeRect(x, y, w, h);
}
function circ(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function shadowEll(x, y, rx, ry = rx * 0.35) { ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(x + 3, y + 2, rx, ry, 0, 0, 7); ctx.fill(); }

function drawSky() {

  // Wolken (flache Blöcke, langsam)
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (let i = 0; i < 6; i++) {
    const cx = ((i * 260 - camX * 0.06 - t * 4) % (W + 300) + W + 300) % (W + 300) - 150, cy = 50 + (i * 53) % 110;
    ctx.fillRect(cx, cy, 90, 16); ctx.fillRect(cx + 14, cy - 10, 50, 12); ctx.fillRect(cx - 12, cy + 8, 60, 12);

  ctx.lineTo(W, 380); ctx.fill();

    ctx.fillStyle = '#6b8a88';

    ctx.fillStyle = '#9ec0c4';
    ctx.fillRect(wx + 8, 372 - bh + 10, 10, 8); ctx.fillRect(wx + bw - 18, 372 - bh + 10, 10, 8);

  }
}

// ================= Spieler =================
function armState() {
  const IDLE = 0.85, BACK = -2.6, REL = -0.5, END = 0.5;
  if (pending) {
    const tau = (pending.xrel - player.x) / SPEED;
    if (tau > WIND + SWING) return { th: IDLE, hold: false };
    if (tau > SWING) { const k = 1 - (tau - SWING) / WIND, e = k * k * (3 - 2 * k); return { th: IDLE + (BACK - IDLE) * e, hold: true }; }
    const k = 1 - Math.max(0, tau) / SWING;
    return { th: BACK + (REL - BACK) * k * k, hold: true };
  }
  if (follow > 0) { const k = 1 - follow / FOLLOW; return { th: REL + (END - REL) * k, hold: false }; }
  return { th: IDLE, hold: false };
}
function drawPlayer() {
  const x = PLAYER_SCREEN_X, y = sy(PLAYER_Z, 0);
  const bob = Math.sin(player.x * 0.06) * 1.5;
  shadowEll(x, y, 36, 7);
  const ph = player.x * 0.07;  // Rad-/Kurbelwinkel
  // Räder
  for (const wx of [x - 24, x + 24]) {
    circ(wx, y - 14, 14, '#17191d'); circ(wx, y - 14, 10, '#6b7078'); circ(wx, y - 14, 8, '#3a3d42');
    ctx.strokeStyle = '#c8cdd2'; ctx.lineWidth = 1.5; ctx.beginPath();
    for (let k = 0; k < 4; k++) { const a = ph + k * Math.PI / 2; ctx.moveTo(wx - Math.cos(a) * 8, y - 14 - Math.sin(a) * 8); ctx.lineTo(wx + Math.cos(a) * 8, y - 14 + Math.sin(a) * 8); }
    ctx.stroke();
  }
  // Rahmen
  ctx.strokeStyle = '#d6453a'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath();
  ctx.moveTo(x - 24, y - 14); ctx.lineTo(x - 6, y - 36); ctx.lineTo(x + 16, y - 36); ctx.lineTo(x + 24, y - 14);
  ctx.moveTo(x - 6, y - 36); ctx.lineTo(x - 2, y - 14); ctx.lineTo(x + 16, y - 36); ctx.moveTo(x + 16, y - 36); ctx.lineTo(x + 14, y - 46); ctx.lineTo(x + 24, y - 47);
  ctx.stroke();
  ctx.strokeStyle = '#17191d'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - 10, y - 38); ctx.lineTo(x - 4, y - 38); ctx.stroke();
  // Beine (pedalieren)
  const px = x - 2 + Math.cos(ph * 1.2) * 8, py = y - 14 + Math.sin(ph * 1.2) * 8;
  ctx.strokeStyle = '#31475e'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x - 6, y - 46 + bob); ctx.lineTo(px + 6, py - 10); ctx.lineTo(px, py); ctx.stroke();
  rectO(px - 4, py - 2, 12, 5, '#2b2f34', 1);
  // Körper
  const arm = armState();
  ctx.save(); ctx.translate(x - 6, y - 50 + bob); ctx.rotate(0.25 + (arm.th - 0.85) * 0.12);
  rectO(-8, -26, 16, 28, '#ff9d3c', 2);
  rectO(-18, -24, 11, 22, '#7a5a3a', 2);                                     // Tasche
  ctx.fillStyle = '#f4f1e8'; for (let k = 0; k < 3; k++) ctx.fillRect(-16 + k * 3, -30 + k, 5, 8);
  ctx.restore();
  // Arm (Wurfanimation: ausholen, schwingen, nachschwingen)
  const sx0 = x - 4, sy0 = y - 70 + bob;
  const ex = sx0 + 15 * Math.cos(arm.th + 0.35), ey = sy0 + 15 * Math.sin(arm.th + 0.35);
  const hx = ex + 15 * Math.cos(arm.th - 0.25), hy = ey + 15 * Math.sin(arm.th - 0.25);
  ctx.strokeStyle = '#ff9d3c'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
  circ(hx, hy, 3.5, '#f2c9a0');
  if (arm.hold) paperSprite(hx + 4, hy - 2, arm.th + 1.2, 0.9);
  // Kopf + Kappe
  circ(x + 2, y - 86 + bob, 9, '#f2c9a0');
  ctx.fillStyle = '#d6453a'; ctx.beginPath(); ctx.arc(x + 2, y - 88 + bob, 9.5, Math.PI, 0); ctx.fill(); ctx.fillRect(x + 4, y - 89 + bob, 14, 3);
  ctx.fillStyle = '#2b2f34'; ctx.fillRect(x + 7, y - 85 + bob, 2, 2);
  ctx.strokeStyle = PAL.outline; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x + 2, y - 86 + bob, 9, 0, 7); ctx.stroke();
  // Schal flattert
  ctx.strokeStyle = '#e8dcae'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - 4, y - 76 + bob);
  ctx.lineTo(x - 16, y - 74 + bob + Math.sin(t * 14) * 3); ctx.lineTo(x - 26, y - 72 + bob + Math.sin(t * 14 + 1) * 4); ctx.stroke();

// ================= Sound (alles per WebAudio erzeugt, keine Dateien) =================
let ac = null, bus = null, musicBus = null, noiseBuf = null;
let musicOn = save.music !== false;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
    bus = ac.createGain(); bus.gain.value = 0.9; bus.connect(comp);
    musicBus = ac.createGain(); musicBus.gain.value = musicOn ? 0.3 : 0; musicBus.connect(comp);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    startMusic();
  } catch (e) { ac = null; }
}
function tone(f0, f1, dur, type, vol, delay = 0, dest = bus) {
  if (!ac) return;
  const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.01, dur / 4));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest); o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(dur, vol, ftype, f0, f1, q = 1, delay = 0, dest = bus) {
  if (!ac) return;
  const t0 = ac.currentTime + delay, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = noiseBuf; src.loop = true;
  f.type = ftype; f.Q.value = q; f.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.02, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(dest); src.start(t0); src.stop(t0 + dur + 0.03);
}
const rnd = (a, b) => a + Math.random() * (b - a);
const SFX = {
  throw()   { noise(0.3, 0.22, 'bandpass', 500, 2400, 1.2); tone(330, 560, 0.09, 'triangle', 0.05); },
  aim()     { tone(660, 990, 0.07, 'square', 0.04); },
  deny()    { tone(200, 130, 0.14, 'sawtooth', 0.05); },
  start()   { tone(392, 784, 0.18, 'square', 0.04); },
  mat()     { tone(150, 55, 0.14, 'sine', 0.3); noise(0.07, 0.18, 'lowpass', 900, 300); tone(660, 660, 0.25, 'triangle', 0.08, 0.05); },
  perfect() { tone(150, 55, 0.14, 'sine', 0.3); noise(0.07, 0.15, 'lowpass', 900, 300);
              [784, 988, 1175, 1568].forEach((f, i) => tone(f, f, 0.2, 'square', 0.045, 0.06 + i * 0.07));
              for (let i = 0; i < 5; i++) tone(rnd(2500, 4500), rnd(2500, 4500), 0.08, 'sine', 0.03, 0.2 + i * 0.05); },
  glass()   { noise(0.6, 0.3, 'highpass', 2500, 7000, 0.8); tone(180, 70, 0.1, 'sine', 0.2);
              for (let i = 0; i < 9; i++) { const f = rnd(2000, 5500); tone(f, f * 0.9, 0.09, 'sine', 0.045, 0.05 + Math.random() * 0.4); } },
  gnome()   { tone(300, 120, 0.12, 'square', 0.07); noise(0.1, 0.15, 'bandpass', 1200, 500); tone(180, 90, 0.2, 'sine', 0.15, 0.05); },
  pot()     { noise(0.3, 0.3, 'bandpass', 900, 400, 0.8); tone(240, 100, 0.1, 'triangle', 0.1); noise(0.08, 0.2, 'highpass', 3000, 3000, 1, 0.12); },
  wall()    { tone(110, 50, 0.12, 'sine', 0.28); noise(0.08, 0.14, 'lowpass', 700, 250); },
  miss()    { noise(0.15, 0.12, 'lowpass', 600, 200); tone(120, 70, 0.14, 'sine', 0.12); },
  coin()    { tone(1319, 1319, 0.07, 'square', 0.04); tone(1760, 1760, 0.14, 'square', 0.04, 0.07); },
  buy()     { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.12, 'triangle', 0.08, i * 0.07)); },
  end()     { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, f, 0.18, 'square', 0.04, i * 0.12)); },
  tick()    { noise(0.012, 0.035, 'highpass', 3500, 3500); },
  bird()    { for (let i = 0; i < 3; i++) tone(rnd(2600, 3000), rnd(3300, 3800), 0.07, 'sine', 0.025, i * 0.11); },
  car()     { noise(1.8, 0.1, 'bandpass', 250, 700, 1, 1.0); tone(95, 70, 1.8, 'sawtooth', 0.025, 1.0); },
};
function sfx(name) { if (ac && SFX[name]) SFX[name](); }

// Musik: kurzer Chiptune-Loop (C - G - Am - F), per Lookahead-Scheduler
const BPM = 116, STEP = 60 / BPM / 2;
const CHORDS = [[48, 52, 55], [55, 59, 62], [57, 60, 64], [53, 57, 60]];
const PENT = [72, 74, 76, 79, 81, 84];
const MELODY = [2, -1, 3, -1, 2, 0, -1, 1, 3, -1, 4, -1, 3, 2, -1, 1, 4, -1, 3, -1, 2, -1, 0, -1, 2, -1, 1, 0, 1, -1, -1, -1];
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
let musicStep = 0, musicNext = 0;
function playStep(step, when) {
  const d = Math.max(0, when - ac.currentTime), bar = Math.floor(step / 8) % 4, pos = step % 8, ch = CHORDS[bar];
  if (pos === 0 || pos === 4) tone(midi(ch[0] - 12), midi(ch[0] - 12), STEP * 1.8, 'triangle', 0.5, d, musicBus);
  if (pos === 6) tone(midi(ch[2] - 12), midi(ch[2] - 12), STEP * 1.2, 'triangle', 0.4, d, musicBus);
  tone(midi(ch[pos % 3] + 12), midi(ch[pos % 3] + 12), STEP * 0.8, 'square', 0.06, d, musicBus);
  const m = MELODY[step % 32];
  if (m >= 0) tone(midi(PENT[m]), midi(PENT[m]), STEP * 1.6, 'square', 0.1, d, musicBus);
  if (pos === 0 || pos === 4) tone(130, 45, 0.12, 'sine', 0.55, d, musicBus);
  if (pos === 2 || pos === 6) noise(0.09, 0.22, 'bandpass', 1800, 1800, 0.8, d, musicBus);
  noise(0.03, 0.08, 'highpass', 6000, 6000, 1, d, musicBus);
}
function startMusic() {
  musicNext = ac.currentTime + 0.1;
  setInterval(() => {
    if (!ac) return;
    if (!musicOn) { musicNext = Math.max(musicNext, ac.currentTime + 0.1); return; }
    while (musicNext < ac.currentTime + 0.35) { playStep(musicStep++, musicNext); musicNext += STEP; }
  }, 100);
}

// ================= Hauptschleife =================
if (location.hash === '#play') startRound();
let last = performance.now();
requestAnimationFrame(function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  try { update(dt); draw(); } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
});
