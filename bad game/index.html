<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dämmerungsflug</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #e7e2d4;
      background: #222824;
      font-family: system-ui, sans-serif;
    }

    main { width: min(96vw, 760px); }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      color: #d9d0b8;
      font-size: clamp(22px, 5vw, 36px);
      letter-spacing: 1px;
      text-shadow: 0 2px 8px #0008;
    }

    #score {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    #frame {
      position: relative;
      overflow: hidden;
      border: 1px solid #716c5e;
      border-radius: 8px;
      box-shadow: 0 8px 30px #0008;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      background: #555b56;
      touch-action: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      text-align: center;
      background: #171b18bb;
    }

    #overlay.hidden { display: none; }

    .card {
      max-width: 420px;
      padding: 24px;
      border: 1px solid #aaa18b;
      border-radius: 8px;
      background: #373a34ee;
      box-shadow: 0 8px 25px #0007;
    }

    .card h2 {
      margin: 0 0 8px;
      color: #e4d8bd;
    }

    button {
      padding: 11px 22px;
      border: 1px solid #b7aa8d;
      border-radius: 6px;
      color: #22251f;
      background: #d2c5a6;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #e2d7bd; }

    .help {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      color: #bcb8a9;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>DÄMMERUNGSFLUG</h1>
      <div id="score">KISTEN: 0　♥ ♥ ♥</div>
    </header>

    <div id="frame">
      <canvas id="game" width="720" height="480"></canvas>
      <div id="overlay">
        <div class="card">
          <h2>Flug über das Tal</h2>
          <p>Sammle Versorgungskisten und weiche den Flugkörpern aus.</p>
          <button id="start">FLUG STARTEN</button>
        </div>
      </div>
    </div>

    <div class="help">
      <span>Steuern: WASD / Pfeiltasten</span>
      <span>Touch: Ziehen</span>
      <span>Kisten sammeln · Hindernissen ausweichen</span>
    </div>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const scoreLabel = document.querySelector("#score");
    const overlay = document.querySelector("#overlay");
    const startButton = document.querySelector("#start");

    const W = canvas.width;
    const H = canvas.height;
    const keys = new Set();

    let player;
    let enemies;
    let crates;
    let particles;
    let score = 0;
    let lives = 3;
    let playing = false;
    let lastTime = 0;
    let enemyTimer = 0;
    let crateTimer = 0;
    let elapsed = 0;
    let pointerDown = false;

    const hills = [
      [
        [0, 315], [120, 270], [240, 310], [390, 250],
        [540, 300], [720, 255], [720, 480], [0, 480]
      ],
      [
        [0, 350], [100, 330], [230, 355], [360, 320],
        [520, 360], [720, 325], [720, 480], [0, 480]
      ]
    ];

    function resetGame() {
      player = {
        x: W / 2,
        y: H * 0.72,
        r: 12,
        speed: 260,
        invulnerable: 0
      };

      enemies = [];
      crates = [];
      particles = [];
      score = 0;
      lives = 3;
      elapsed = 0;
      enemyTimer = 0;
      crateTimer = 0;
      playing = true;
      lastTime = performance.now();

      overlay.classList.add("hidden");
      updateScore();
      requestAnimationFrame(loop);
    }

    function updateScore() {
      scoreLabel.textContent =
        `KISTEN: ${score}　${"♥ ".repeat(lives)}${"♡ ".repeat(3 - lives)}`;
    }

    function endGame() {
      playing = false;
      overlay.innerHTML = `
        <div class="card">
          <h2>Flug beendet</h2>
          <p>Du hast <strong>${score}</strong> Versorgungskisten gesammelt.</p>
          <button id="again">NOCH EIN FLUG</button>
        </div>
      `;
      overlay.classList.remove("hidden");
      document.querySelector("#again").addEventListener("click", resetGame);
    }

    function spawnEnemy() {
      const r = 10 + Math.random() * 8;
      enemies.push({
        x: r + Math.random() * (W - r * 2),
        y: -r,
        r,
        speed: 100 + Math.random() * 55 + elapsed * 1.2,
        drift: (Math.random() - 0.5) * 30
      });
    }

    function spawnCrate() {
      crates.push({
        x: 25 + Math.random() * (W - 50),
        y: -18,
        r: 10,
        speed: 85 + Math.random() * 35,
        angle: (Math.random() - 0.5) * 0.2
      });
    }

    function makeDust(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 25 + Math.random() * 100;

        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.35 + Math.random() * 0.35,
          maxLife: 0.7,
          color
        });
      }
    }

    function collides(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r;
    }

    function update(dt) {
      elapsed += dt;

      let dx = 0;
      let dy = 0;

      if (keys.has("ArrowLeft") || keys.has("a")) dx--;
      if (keys.has("ArrowRight") || keys.has("d")) dx++;
      if (keys.has("ArrowUp") || keys.has("w")) dy--;
      if (keys.has("ArrowDown") || keys.has("s")) dy++;

      const length = Math.hypot(dx, dy) || 1;
      player.x += (dx / length) * player.speed * dt;
      player.y += (dy / length) * player.speed * dt;

      player.x = Math.max(player.r, Math.min(W - player.r, player.x));
      player.y = Math.max(player.r, Math.min(H - player.r, player.y));
      player.invulnerable = Math.max(0, player.invulnerable - dt);

      enemyTimer -= dt;
      crateTimer -= dt;

      if (enemyTimer <= 0) {
        spawnEnemy();
        enemyTimer = Math.max(0.35, 1.15 - elapsed * 0.006);
      }

      if (crateTimer <= 0) {
        spawnCrate();
        crateTimer = 1.4 + Math.random() * 0.9;
      }

      for (const enemy of enemies) {
        enemy.y += enemy.speed * dt;
        enemy.x += enemy.drift * dt;
      }

      for (const crate of crates) {
        crate.y += crate.speed * dt;
      }

      enemies = enemies.filter(enemy => enemy.y < H + enemy.r);
      crates = crates.filter(crate => crate.y < H + crate.r);

      for (let i = crates.length - 1; i >= 0; i--) {
        if (collides(player, crates[i])) {
          makeDust(crates[i].x, crates[i].y, "#c9ad79", 10);
          crates.splice(i, 1);
          score++;
          updateScore();
        }
      }

      if (player.invulnerable <= 0) {
        for (const enemy of enemies) {
          if (collides(player, enemy)) {
            makeDust(player.x, player.y, "#b9b3a1", 14);
            enemy.y = H + 100;
            lives--;
            player.invulnerable = 1.25;
            updateScore();

            if (lives <= 0) endGame();
            break;
          }
        }
      }

      for (const particle of particles) {
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.life -= dt;
      }

      particles = particles.filter(particle => particle.life > 0);
    }

    function drawHills(points, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);

      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i][0], points[i][1]);
      }

      ctx.closePath();
      ctx.fill();
    }

    function draw() {
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#65747a");
      sky.addColorStop(0.48, "#9a9a86");
      sky.addColorStop(0.7, "#b29a78");
      sky.addColorStop(0.71, "#656452");
      sky.addColorStop(1, "#353a32");

      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // A distant pale sun
      ctx.fillStyle = "#d7c9a1";
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.arc(560, 115, 34, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // Distant landscape layers
      drawHills(hills[0], "#656657");
      drawHills(hills[1], "#4d5145");

      // Simple ground texture
      ctx.strokeStyle = "#89816a";
      ctx.globalAlpha = 0.28;
      ctx.lineWidth = 1;

      for (let i = 0; i < 30; i++) {
        const x = (i * 97 + elapsed * 12) % W;
        const y = 355 + (i * 43) % 120;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 24, y + 3);
        ctx.stroke();
      }

      ctx.globalAlpha = 1;

      // Supply crates
      for (const crate of crates) {
        ctx.save();
        ctx.translate(crate.x, crate.y);
        ctx.rotate(crate.angle);

        ctx.fillStyle = "#b79358";
        ctx.fillRect(-9, -7, 18, 14);

        ctx.strokeStyle = "#594a35";
        ctx.lineWidth = 2;
        ctx.strokeRect(-9, -7, 18, 14);

        ctx.beginPath();
        ctx.moveTo(-8, 0);
        ctx.lineTo(8, 0);
        ctx.moveTo(0, -6);
        ctx.lineTo(0, 6);
        ctx.stroke();

        ctx.restore();
      }

      // Small dark aircraft in the distance
      for (const enemy of enemies) {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        ctx.rotate(Math.sin(elapsed + enemy.x) * 0.08);

        ctx.fillStyle = "#493f39";
        ctx.strokeStyle = "#302e2a";
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        ctx.moveTo(0, -enemy.r);
        ctx.lineTo(enemy.r * 0.8, 0);
        ctx.lineTo(enemy.r * 0.45, enemy.r * 0.65);
        ctx.lineTo(-enemy.r * 0.45, enemy.r * 0.65);
        ctx.lineTo(-enemy.r * 0.8, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      }

      // Player aircraft
      if (player && (
        player.invulnerable <= 0 ||
        Math.floor(performance.now() / 120) % 2 === 0
      )) {
        ctx.save();
        ctx.translate(player.x, player.y);

        ctx.fillStyle = "#d2c9ad";
        ctx.strokeStyle = "#45463f";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(0, -18);
        ctx.lineTo(4, -3);
        ctx.lineTo(17, 8);
        ctx.lineTo(16, 12);
        ctx.lineTo(4, 9);
        ctx.lineTo(3, 16);
        ctx.lineTo(8, 19);
        ctx.lineTo(8, 21);
        ctx.lineTo(0, 19);
        ctx.lineTo(-8, 21);
        ctx.lineTo(-8, 19);
        ctx.lineTo(-3, 16);
        ctx.lineTo(-4, 9);
        ctx.lineTo(-16, 12);
        ctx.lineTo(-17, 8);
        ctx.lineTo(-4, -3);
        ctx.closePath();

        ctx.fill();
        ctx.stroke();

        // Cockpit
        ctx.fillStyle = "#687a7b";
        ctx.beginPath();
        ctx.ellipse(0, 1, 3, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // Dust and impact particles
      for (const particle of particles) {
        ctx.globalAlpha = Math.max(0, particle.life / particle.maxLife) * 0.65;
        ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x, particle.y, 3, 3);
      }

      ctx.globalAlpha = 1;
    }

    function loop(now) {
      if (!playing) return;

      const dt = Math.min((now - lastTime) / 1000, 0.04);
      lastTime = now;

      update(dt);
      draw();

      if (playing) requestAnimationFrame(loop);
    }

    function movePlayerToPointer(event) {
      const rect = canvas.getBoundingClientRect();
      player.x = (event.clientX - rect.left) * W / rect.width;
      player.y = (event.clientY - rect.top) * H / rect.height;
      player.x = Math.max(player.r, Math.min(W - player.r, player.x));
      player.y = Math.max(player.r, Math.min(H - player.r, player.y));
    }

    canvas.addEventListener("pointerdown", event => {
      if (!playing) return;
      pointerDown = true;
      movePlayerToPointer(event);
    });

    canvas.addEventListener("pointermove", event => {
      if (playing && pointerDown) movePlayerToPointer(event);
    });

    window.addEventListener("pointerup", () => {
      pointerDown = false;
    });

    window.addEventListener("keydown", event => {
      const key = event.key.length === 1
        ? event.key.toLowerCase()
        : event.key;

      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(key)) {
        event.preventDefault();
      }

      keys.add(key);
    });

    window.addEventListener("keyup", event => {
      const key = event.key.length === 1
        ? event.key.toLowerCase()
        : event.key;

      keys.delete(key);
    });

    startButton.addEventListener("click", resetGame);
    draw();
  </script>
</body>
</html>
