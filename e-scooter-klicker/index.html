<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#10151c">
<title>E-Scooter Klicker</title>
<link rel="icon" href="images/escooter.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #10151c; color: #eceff2; font: 15px system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; user-select: none;
  }
  .top { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid #2a2a2a; background: #0a0a0a; }
  .top a { color: #9eacba; text-decoration: none; font-size: 13px; }
  .top a:hover { color: #65e6a5; }
  .top b { color: #e10600; letter-spacing: .2em; font-size: 12px; text-transform: uppercase; margin-left: auto; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(260px, 1fr) minmax(0, 1.2fr) minmax(260px, 340px); }
  section { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .click { align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center; border-right: 1px solid #2a2a2a; }
  .count { font-size: clamp(34px, 6vw, 56px); font-weight: 900; color: #65e6a5; line-height: 1; }
  .label { color: #9eacba; font-size: 14px; }
  .ps { color: #ffd166; font-weight: 700; }
  #btn {
    position: relative; width: min(300px, 70vw); aspect-ratio: 1; border: 4px solid #65e6a5; border-radius: 50%;
    background: #fff url(images/escooter.png) center / 118% no-repeat; cursor: pointer; padding: 0;
    box-shadow: 0 0 0 0 #65e6a555; transition: transform .06s;
  }
  #btn:hover { box-shadow: 0 0 28px 4px #65e6a544; }
  #btn:active, #btn.press { transform: scale(.94); }
  .pop { position: fixed; pointer-events: none; font-weight: 900; color: #65e6a5; text-shadow: 0 1px 3px #000; animation: pop .8s ease-out forwards; z-index: 10; }
  @keyframes pop { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-60px); } }
  .fleet { border-right: 1px solid #2a2a2a; background: linear-gradient(#1b2530, #2b3540 60%, #4a4f55 60% 64%, #5b5f64 64%); position: relative; }
  .fleet h3 { margin: 0; padding: 10px 14px; font-size: 13px; color: #9eacba; position: relative; z-index: 2; background: #0a0a0acc; }
  #field { position: absolute; inset: 38px 0 0 0; overflow: hidden; }
  #field img { position: absolute; width: 44px; height: auto; mix-blend-mode: screen; filter: invert(1) hue-rotate(180deg); animation: drop .35s ease-out; }
  @keyframes drop { from { opacity: 0; transform: translateY(-120px); } to { opacity: 1; transform: none; } }
  .shop { padding: 12px; gap: 8px; overflow-y: auto; background: #0a0a0a; }
  .shop h3 { margin: 0 0 2px; font-size: 14px; color: #65e6a5; }
  .up {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; padding: 10px 12px; width: 100%;
    background: #10151c; color: inherit; border: 1px solid #2a2a2a; border-radius: 4px; cursor: pointer; font: inherit;
  }
  .up:hover:not(:disabled) { border-color: #65e6a5; }
  .up:disabled { opacity: .45; cursor: not-allowed; }
  .up .n { font-weight: 800; }
  .up .c { color: #ffd166; font-weight: 800; text-align: right; }
  .up .d { grid-column: 1 / 2; color: #9eacba; font-size: 12px; }
  .up .o { color: #65e6a5; font-weight: 800; text-align: right; }
  .tabs { display: flex; gap: 6px; }
  .tab { flex: 1; padding: 8px; background: #10151c; color: #9eacba; border: 1px solid #2a2a2a; border-radius: 4px; cursor: pointer; font: inherit; font-weight: 800; }
  .tab.on { color: #0a0a0a; background: #65e6a5; border-color: #65e6a5; }
  .ms { padding: 10px 12px; border: 1px solid #2a2a2a; border-radius: 4px; background: #10151c; margin-bottom: 8px; }
  .ms h4 { margin: 0 0 4px; font-size: 14px; color: #ffd166; }
  .ms p { margin: 0; color: #c4ced8; font-size: 13px; line-height: 1.45; }
  .ms.locked { opacity: .5; }
  .ms.locked h4 { color: #9eacba; }
  .ms .goal { color: #9eacba; font-size: 12px; margin-top: 4px; }
  .earth { margin: 0 0 10px; font-size: 12px; color: #9eacba; }
  .earth i { display: block; height: 6px; margin-top: 4px; background: #2a2a2a; border-radius: 3px; overflow: hidden; }
  .earth i b { display: block; height: 100%; background: #65e6a5; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50; max-width: min(92vw, 420px); padding: 12px 16px; background: #0a0a0a; border: 2px solid #ffd166; border-radius: 4px; box-shadow: 0 4px 20px #000a; animation: toast 5s ease forwards; cursor: pointer; }
  .toast b { color: #ffd166; display: block; }
  .toast span { color: #c4ced8; font-size: 13px; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 30px); } 8%, 88% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); } }
  .reset { margin-top: auto; background: none; border: 1px solid #2a2a2a; color: #9eacba; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 22vh 1fr; overflow-y: auto; }
    .click { border-right: 0; border-bottom: 1px solid #2a2a2a; padding: 10px; }
    #btn { width: min(180px, 40vw); }
    .fleet { border-right: 0; border-bottom: 1px solid #2a2a2a; }
  }
  .splash { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 22px; background: #10151c; pointer-events: none; animation: splash-out 0.6s ease 2.2s forwards; }
  .splash-name { color: #e10600; font-size: clamp(32px, 9vw, 84px); font-weight: 900; letter-spacing: 0.08em; animation: splash-in 0.9s ease both; }
  .splash-bar { width: clamp(140px, 30vw, 320px); height: 3px; background: #e1060033; overflow: hidden; }
  .splash-bar i { display: block; width: 100%; height: 100%; background: #e10600; transform-origin: left; animation: splash-load 2s ease-in-out both; }
  @keyframes splash-in { from { opacity: 0; letter-spacing: 0.3em; } to { opacity: 1; letter-spacing: 0.08em; } }
  @keyframes splash-load { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes splash-out { to { opacity: 0; visibility: hidden; } }
</style>
</head>
<body>
<div class="splash" aria-hidden="true">
  <div class="splash-name">KroxenStudios</div>
  <div class="splash-bar"><i></i></div>
</div>
<div class="top"><a href="../index.html" id="back">&larr; Waiting Games</a><b>KroxenStudios</b></div>
<main>
  <section class="click">
    <div class="label" id="lblScooter">E-Scooter</div>
    <div class="count" id="count">0</div>
    <div class="label"><span class="ps" id="ps">0</span> <span id="lblPs">pro Sekunde</span> &middot; <span id="pc">1</span> <span id="lblPc">pro Klick</span></div>
    <button id="btn" aria-label="E-Scooter klicken"></button>
  </section>
  <section class="fleet">
    <h3 id="lblFleet">Deine Flotte</h3>
    <div id="field"></div>
  </section>
  <section class="shop">
    <div class="tabs">
      <button class="tab on" id="tabShop">Power-ups</button>
      <button class="tab" id="tabMs"><span id="lblMs">Meilensteine</span> <span id="msCount"></span></button>
    </div>
    <div id="shop"></div>
    <div id="msPanel" hidden></div>
    <button class="reset" id="reset">Spielstand zurücksetzen</button>
  </section>
</main>
<script src="../i18n.js"></script>
<script src="game.js"></script>
</body>
</html>
